#:schema https://fnox.jdx.dev/schema.json

[providers]
  [providers.sync]
  type = "age"
  # private key
  key_file = "~/.config/fnox/age.txt"
  # public key
  recipients = [
    "age1w8xkpnudhum95ethf94jkqkslgmk544pn0mh87egcnqwp37ztc3qrj6kcs",
  ]

  [providers."op:ktbs:credential"]
  account = "ktbsoft.1password.com"
  type    = "1password"
  vault   = "credential"

  [providers."op:personal:credential"]
  account = "my.1password.com"
  type    = "1password"
  vault   = "credential"


[profiles.github]
  [profiles.github.secrets]
    [profiles.github.secrets.GITHUB_USERNAME]
    default     = "bkenks"
    description = "Github Username"

    [profiles.github.secrets.GITHUB_TOKEN]
    description = "Github PAT"
    provider    = "op:personal:credential"
    sync        = { provider = "sync", value = "fnox-age-batch-v1::pZH+MpxTzOiIT1dmhraw2vy6q+OPDWRonPI34kZzJcbttFJ5b3s2f9ZeLmEpP1ekIsbilAGCf8EOY8zth9tYPsBxDqI=" }
    value       = "github.pat/token"

[profiles.backblaze]
  [profiles.backblaze.secrets]
    [profiles.backblaze.secrets.B2_APPLICATION_KEY_ID]
    description = "Backblaze ID"
    provider    = "op:personal:credential"
    sync        = { provider = "cache", value = "fnox-age-batch-v1::tjLlM4MwMXYqcVVq3radtqNoNn5RAdYvMP9HgYXi1M20oynS3M0mUw==" }
    value       = "backblaze-b2.master-app-key/key_id"

    [profiles.backblaze.secrets.B2_APPLICATION_KEY]
    description = "Backblaze PAT"
    provider    = "op:personal:credential"
    sync        = { provider = "cache", value = "fnox-age-batch-v1::HxBTGV6dtuEojMMRLiA6U51Mae01Bb/qAU7uP7hR3huQnS2+GZGW96hBxDyuDu0j7kw35hGJd7jQKQXEyySEDeVk9ZWgnw==" }
    value       = "backblaze-b2.master-app-key/credential"
