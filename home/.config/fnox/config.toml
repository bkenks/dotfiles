#:schema https://fnox.jdx.dev/schema.json

[providers]
  [providers.sync]
  type = "age"
  # private key
  key_file = "~/.config/fnox/age.txt"
  # public key
  recipients = [
    "age1w8xkpnudhum95ethf94jkqkslgmk544pn0mh87egcnqwp37ztc3qrj6kcs",
  ]

  [providers."op:ktbs:credential"]
  account = "ktbsoft.1password.com"
  type    = "1password"
  vault   = "credential"

  [providers."op:personal:credential"]
  account = "my.1password.com"
  type    = "1password"
  vault   = "credential"

[secrets]
  [secrets.GITHUB_USERNAME]
  default     = "bkenks"
  description = "Github Username"

  [secrets.GITHUB_TOKEN]
  description = "Github PAT"
  provider    = "op:personal:credential"
  sync        = { provider = "sync", value = "fnox-age-batch-v1::ArCXCQH31Z5HOQw4ib2a5BN5OiBrwlWfmItO9TYn5JGFTQzBYBKY4lijtOdrdzuxIgFkA7jxb7rXwppzV9FdaAQEDj0=" }
  value       = "github.pat/token"

[profiles.backblaze]
  [profiles.backblaze.secrets.B2_APPLICATION_KEY_ID]
  description = "Backblaze ID"
  provider    = "op:personal:credential"
  sync        = { provider = "sync", value = "fnox-age-batch-v1::hSsn2gfvf/0Zvg9nGNxNAJiurEBM65dhcEZHEkBf5Fad8djf/CZ+gQ==" }
  value       = "backblaze-b2.master-app-key/key_id"

  [profiles.backblaze.secrets.B2_APPLICATION_KEY]
  description = "Backblaze PAT"
  provider    = "op:personal:credential"
  sync        = { provider = "sync", value = "fnox-age-batch-v1::t9s5hKE4IK2a1G/jRuHz2HA0ttbmnkQ/4UiAyw09YJt41lo4uO3ovVDSPUXWPLvaLekptT5WHIDbkcr1aYojC4tjO0Xzcw==" }
