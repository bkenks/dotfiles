#:schema https://fnox.jdx.dev/schema.json

[providers]
  [providers.sync]
  type = "age"
  # private key
  key_file = "~/.config/fnox/age.txt"
  # public key
  recipients = [
    "age1w8xkpnudhum95ethf94jkqkslgmk544pn0mh87egcnqwp37ztc3qrj6kcs",
  ]

  [providers."op:ktbs:credential"]
  account = "ktbsoft.1password.com"
