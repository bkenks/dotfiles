# :schema https://mise.jdx.dev/schema/mise.json
[tools]
1password              = "2.39"
"aqua:numtide/treefmt" = "2.6"
copier                 = "9.18"
fd                     = "10.5"
fnox                   = "1.35"
go                     = "1.27"
gofumpt                = "0.12"
java                   = "temurin-25"
node                   = "26"
"npm:@caveman-ai/cli"  = "1.3"
"npm:ccstatusline"     = "2.2"
oxfmt                  = "0.70"
rg                     = "15"
shellcheck             = "0.11"
shfmt                  = "3.14"
starship               = "1.26"
taplo                  = "0.10"
uv                     = "0.12.17"
watchexec              = "2.7"

[env]
# Keep `go install` output outside mise's versioned toolchain dir, which is
# wiped whenever the Go version changes. ~/.local/bin is on PATH via ~/.zshenv.
GOBIN = "{{env.HOME}}/.local/bin"

[history]
exclude = ["**/*.local*", "**/*.env*", "**/*secret*", "**/.vscode/**"]
