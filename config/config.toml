#:schema https://mise.jdx.dev/schema/mise.json

# ==============================================================================
# Core: mise settings, variables, environment
# ==============================================================================

[vars]
pathdir_snippets = "{{config_root}}/.config/mise/snippets"

[env]
_.path = ["/Applications/Inkscape.app/Contents/MacOS"]

# ==============================================================================
# Tools: CLI tools managed by mise
# ==============================================================================

# Short names for tools pulled from non-default backends
[tool_alias]
ccstatusline   = "npm:ccstatusline"
ccusage        = "npm:ccusage"
gitkeeper      = "forgejo:bkenks/gitkeeper"
lighthouse     = "npm:lighthouse"
likec4         = "npm:likec4"
treefmt        = "aqua:numtide/treefmt"
woodpecker-cli = "github:woodpecker-ci/woodpecker"

[tools]
1password        = "2.39"
copier           = "9.18"
cue              = "0.17.1"
direnv           = "2.37"
fd               = "10.5"
fnox             = "1.35"
go               = "1.27"
gofumpt          = "0.12"
java             = "temurin-25"
likec4           = "1.59"
lychee           = "0.24"
node             = "26.10"
oxfmt            = "0.70"
pkl              = "0.32.1"
prettier         = "3.9.10"
rg               = "15.2"
shellcheck       = "0.11"
shfmt            = "3.14"
starship         = "1.26"
taplo            = "0.10"
treefmt          = "2.6"
uv               = "0.12"
watchexec        = "2.7"
worktrunk        = "0.80"
"pipx:harlequin" = "latest"

# Tools needing extra options
[tools.gitkeeper]
api_url             = "https://fj.ktbcloud.com/api/v1"
bin                 = "gitkeeper"
minimum_release_age = "0h"
version             = "latest"

[tools.woodpecker-cli]
platforms.macos-arm64 = { asset_pattern = "woodpecker-cli_darwin_arm64.tar.gz" }
version               = "3.19.0"

# ==============================================================================
# Bootstrap: machine setup (shell, packages, macOS defaults, services)
# ==============================================================================

# --- Packages (Homebrew casks, formulae, Mac App Store) ------------------------

[bootstrap.packages]
# Casks
"brew-cask:1password"             = "latest"
"brew-cask:font-maple-mono"       = "latest"
"brew-cask:font-maple-mono-nf"    = "latest"
"brew-cask:font-maple-mono-nf-cn" = "latest"
"brew-cask:iterm2"                = "latest"
"brew-cask:keyclu"                = "latest"
"brew-cask:lm-studio"             = "latest"
"brew-cask:macshot"               = "latest"
"brew-cask:openlogi"              = "latest"
"brew-cask:vscodium"              = "latest"
"brew-cask:zen"                   = "latest"
# Formulae
"brew:b2-tools"       = "latest"
"brew:bbrew"          = "latest"
"brew:colima"         = "latest"
"brew:docker"         = "latest"
"brew:docker-buildx"  = "latest"
"brew:docker-compose" = "latest"
"brew:gh"             = "latest"
"brew:git"            = "latest"
"brew:helix"          = "latest"
"brew:imagemagick"    = "latest"
"brew:lazydocker"     = "latest"
"brew:lazygit"        = "latest"
"brew:mas"            = "latest"
"brew:mole"           = "latest"
"brew:ov"             = "latest"
"brew:technitium-dns" = "latest"
"brew:tree"           = "latest"
"brew:dasel"          = "latest"
# Mac App Store
"mas:1236045954" = "latest" # Canary Mail
"mas:6468120888" = "latest" # CleanMyKeyboard

# --- macOS defaults ------------------------------------------------------------

[bootstrap.macos.dock]
autohide               = true
autohide_delay         = 0
autohide_time_modifier = 0.25
show_recents           = false

[bootstrap.macos.finder]
preferred_view_style    = "list"
show_extensions_warning = false
show_pathbar            = true
sort_folders_first      = true

[bootstrap.macos.keyboard]
automatic_capitalization      = false
automatic_spelling_correction = false
initial_key_repeat            = 15
key_repeat                    = 2

[bootstrap.macos.defaults.NSGlobalDomain]
NSFileViewer = "com.binarynights.ForkLift"

# Register NSFileViewer (above) as the default handler for folders
[bootstrap.hooks.post-defaults]
run = '''
ls_domain="com.apple.LaunchServices/com.apple.launchservices.secure"
file_viewer="$(defaults read NSGlobalDomain NSFileViewer)"

if ! defaults read "$ls_domain" LSHandlers 2>/dev/null | grep -q '"public.folder"'; then
  defaults write "$ls_domain" LSHandlers -array-add \
    "{LSHandlerContentType=\"public.folder\";LSHandlerRoleAll=\"$file_viewer\";}"
fi
'''

# --- Services ------------------------------------------------------------------

# Watches files for [history] below
[bootstrap.services.mise-history]
builtin = "history-watch"

[history]
exclude = [
  "**/*.local*",
  "**/*.env*",
  "**/*secret*",
  "**/.vscode/**",
  "**/*age.txt",
  "**/*fnox.local.toml",
]

[dotfiles]
# --- Tracked files/directories -------------------------------------------------
"~/.config/ccstatusline"                              = { mode = "track" }
"~/.config/fnox"                                      = { mode = "track", exclude = ["age.txt"] }
"~/.config/git"                                       = { mode = "track" }
"~/.config/karabiner/karabiner.json"                  = { mode = "track" }
"~/.config/mise"                                      = { mode = "track" }
"~/.config/starship.toml"                             = { mode = "track" }
"~/Library/Application Support/VSCodium/product.json" = { mode = "track" }

# --- ~/.zshrc: inline blocks ---------------------------------------------------
"~/.zshrc/direnv"   = { block = 'eval "$(direnv hook zsh)"' }
"~/.zshrc/fnox"     = { block = 'eval "$(fnox activate zsh)"' }
"~/.zshrc/starship" = { block = 'eval "$(starship init zsh)"' }

# --- ~/.zshrc: blocks from dotfiles-snippets/ ----------------------------------
"~/.zshrc/alias_mise" = { template = "tera", block = '{{ read_file(path=vars.pathdir_snippets ~ "/alias_mise.sh") }}' }
"~/.zshrc/alias"      = { template = "tera", block = '{{ read_file(path=vars.pathdir_snippets ~ "/alias.sh") }}' }
"~/.zshrc/db"         = { template = "tera", block = '{{ read_file(path=vars.pathdir_snippets ~ "/db.sh") }}' }
"~/.zshrc/editors"    = { template = "tera", block = '{{ read_file(path=vars.pathdir_snippets ~ "/editors.zsh") }}' }
"~/.zshrc/yazi"       = { template = "tera", block = '{{ read_file(path=vars.pathdir_snippets ~ "/yazi.zsh") }}' }

# --- ~/.ssh/config: blocks from dotfiles-snippets/ -----------------------------
"~/.ssh/config/backrest-tunnel" = { template = "tera", block = '{{ read_file(path=vars.pathdir_snippets ~ "/backrest-tunnel") }}' }
