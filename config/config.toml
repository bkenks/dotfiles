# :schema https://mise.jdx.dev/schema/mise.json
[tools]
1password              = "2.39"
"aqua:numtide/treefmt" = "2.6"
copier                 = "9.18"
fd                     = "10.5"
fnox                   = "1.35"
go                     = "1.27"
gofumpt                = "0.12"
java                   = "temurin-25"
node                   = "26"
"npm:@caveman-ai/cli"  = "1.3"
"npm:ccstatusline"     = "2.2"
oxfmt                  = "0.70"
rg                     = "15"
shellcheck             = "0.11"
shfmt                  = "3.14"
starship               = "1.26"
taplo                  = "0.10"
uv                     = "0.12.17"
watchexec              = "2.7"

[env]
# Keep `go install` output outside mise's versioned toolchain dir, which is
# wiped whenever the Go version changes. ~/.local/bin is on PATH via ~/.zshenv.
GOBIN = "{{env.HOME}}/.local/bin"

[vars]
pathMiseBootstrapConfig = "{{xdg_config_home}}/mise/conf.d/bootstrap.toml"
pathMiseDotfilesConfig  = "{{xdg_config_home}}/mise/conf.d/dotfiles.toml"

[history]
exclude = ["**/*.local*", "**/*.env*", "**/*secret*", "**/.vscode/**"]

[tasks."dot:add"]
description = "Track a dotfile with mise"
usage       = 'arg "<path>" help="Path of directory or file to track"'

run = '''
case "$usage_path" in
  "$HOME"/*) target="~${usage_path#"$HOME"}" ;;
  *) echo "error: $usage_path is not under $HOME" >&2; exit 1 ;;
esac
if grep -qF "\"$target\" =" "{{vars.pathMiseDotfilesConfig}}"; then
  echo "already declared: $target"
else
  printf '"%s" = { mode = "track" }\n' "$target" >> "{{vars.pathMiseDotfilesConfig}}"
fi
mise dotfiles save "$usage_path"
'''
