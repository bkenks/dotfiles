# env_conf_d
#
# Status:   Early opt-in to a future default
# Default:  false (becomes true in mise 2027.8.10)
#
# Behavior:
#   - On:  `conf.d` fragments named with an environment load only when that
#          environment is active (via `MISE_ENV` or `-E`).
#          e.g. `conf.d/tools.development.toml` loads only with `development`.
#   - Off: every non-hidden TOML file in `conf.d` loads, regardless of name.
env_conf_d = true
