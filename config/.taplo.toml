[formatting]
align_entries = true
reorder_keys  = true

[[rule]]
include = [
  "**/mise/config.toml",
  "**/mise/conf.d/*.toml",
  "**/mise.toml",
  "**/.mise.toml",
  "**/mise.*.toml",        # mise.local.toml, mise.dev.toml, etc.
]
name = "mise"

[rule.schema]
url = "https://mise.jdx.dev/schema/mise.json"
