[tasks."claude:kill"]
usage = '''
arg "[pid]" help="Process id"
'''

run = '''

[ -n "${usage_pid:-}" ] && { kill -KILL "$usage_pid" }

pgrep -af claude

read -r -p "Kill all? [y/N] " ans
case "$ans" in
  [yY]|[yY][eE][sS]) pkill -TERM -f 'claude' ;;
  *) echo "aborted"; exit 1 ;;
esac

sleep 5

pgrep -af claude

read -r -p "Run force all? [y/N] " ans
case "$ans" in
  [yY]|[yY][eE][sS]) pkill -TERM -f 'claude' ;;
  *) echo "aborted"; exit 1 ;;
esac

'''