[tasks."uv:temp-environment"]
alias = "uv:tmpenv"
description = "Create temporary virtual environment for script and return path"
dir = "{{cwd}}"
run = '''
uv sync --script "$usage_script"
venv_path=$(uv python find --script "$usage_script")
printf '%s' "$venv_path" | pbcopy
'''
usage = 'arg "<script>" help="Filename of script"'
