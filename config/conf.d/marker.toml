[tasks."marker:mark"]
usage = '''
arg "[directory]" default="." help="Directory path (no trailing slash)"
'''
vars.baseName = ".marker"
vars.randBytes = "8"

run = '''
path="$usage_directory/{{vars.baseName}}"

# Fail if marker already exists
[ -e "$path" ] && { echo "marker exists" >&2; exit 1; }

'''
