[vars]
baseName = ".marker"

[tasks."marker:mark"]
vars.randBytes = "8"
dir = "{{cwd}}"

usage = '''
arg "[directory]" default="." help="Directory path (no trailing slash)"
'''

run = '''
pathFile="$usage_directory/{{vars.baseName}}"  # path to file

[ -e "$pathFile" ] && { echo "marker exists" >&2; exit 1; }  # Fail if marker already exists

id=$(openssl rand -hex 8)  # generate unique id
printf '%s\n' "$id" > "$pathFile"  # write id to file
'''

[tasks."marker:get"]
dir = "{{cwd}}"

usage = '''
arg "<id>" help="Directory id (e.g. 373f94134cd8c581, or b4b575a227b9950e)"
'''


