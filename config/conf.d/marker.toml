[vars]
namefile_marker = ".marker"

[task_templates.marker]
dir = "{{cwd}}"

[tasks."marker:mark"]
extends = "marker"
vars    = { randBytes = "8" }

usage = '''
arg "[directory]" default="." help="Directory path (no trailing slash)"
'''

run = '''
path_file="$usage_directory/$BASE_NAME"                       # path to file

[ -e "$path_file" ] && { echo "marker exists" >&2; exit 1; }  # fail if marker exists

id=$(openssl rand -hex 8)                                     # generate unique id
printf '%s\n' "$id" > "$path_file"                            # write id to file
'''

[tasks."marker:get"]
extends = "marker"

env = { opts = "lFuu" }
usage = '''
arg "<id>" help="Directory id (e.g. 373f94134cd8c581, b4b575a227b9950e)"
'''
run = '''
rg -"$opts" $usage_id -g $namefile_marker
'''
