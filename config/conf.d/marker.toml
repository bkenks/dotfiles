[tasks."marker:mark"]
vars.baseName = ".marker"
vars.randBytes = "8"
dir = "{{cwd}}"

usage = '''
arg "[directory]" default="." help="Directory path (no trailing slash)"
'''

run = '''
pathMarker="$usage_directory/{{vars.baseName}}"

[ -e "$pathMarker" ] && { echo "marker exists" >&2; exit 1; }  # Fail if marker already exists

id=$(openssl rand -hex 
printf '%s\n' "" > "$pathMarker"

'''
