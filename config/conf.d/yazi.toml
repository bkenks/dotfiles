[tools]
7zip = "26"
fd = "10.5"
ffmpeg = "9"
fzf = "0.74"
imagemagick = "7"
jq = "1.8"
poppler = "26"
resvg = "0.48"
rg = "15"
yazi = { version = "26", depends = [
  "fd",
  "7zip",
  "ffmpeg",
  "fzf",
  "imagemagick",
  "jq",
  "poppler",
  "resvg",
  "rg",
  "zoxide",
] }
zoxide = "0.10"

[dotfiles]
"~/.zshrc/yazi" = { template = "tera", block = '''
# `y` opens 
function y() {
	local tmp cwd; tmp="$(mktemp -t "yazi-cwd.XXXXXX")"
	command yazi "$@" --cwd-file="$tmp"
	IFS= read -r -d '' cwd < "$tmp"
	[ "$cwd" != "$PWD" ] && [ -d "$cwd" ] && builtin cd -- "$cwd" || builtin true
	command rm -f -- "$tmp"
}
''' }
