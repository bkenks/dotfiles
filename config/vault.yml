name: vault

flags:
  format:
    prefix:
      short: "-"
      long: "--"

command:
  add:
    description: Adds files to vault
    arg:
      file:
        required: false
        description: File name
    flags:
      all:
        acceptValue: false

  find:
    description: Searches for files with matching names.
    defaultAction: print usage
    arg:
      term:
        required: false
        description: Search term
    flag:

  list:
    action: Lists all items. No args = list of tables.
    arg:
      table:
        required: false
        description: Table name

  open:
    action: Open file in default viewer.

  get:
    action: Return path on disk
    arg:
      file:
        required: true
        description: File name

  release:
    action: Release file/table from vault
    arg:
      file:
        required: false
        description: File name
      table:
        required: false
        description: Table name
